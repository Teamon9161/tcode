[package]
name = "tcode-app"
version = "0.1.28"
edition = "2021"
description = "Desktop backend for tcode: the sidecar an Electron shell spawns"

# Deliberately NOT a workspace member. The reason is not the old one — the
# Tauri webview dependency that forced it is gone — but the conclusion is
# unchanged: this crate builds the binary an Electron shell spawns as a child
# process, and its artifact is referenced by that shell's packaging. Keeping it
# out of `cargo build --workspace` means the terminal frontend's build never
# needs this crate's heavier dependencies (portable-pty, hyper), and nothing in
# the workspace has to know how the desktop app is assembled. Build it from
# this directory.

[lib]
name = "tcode_app"
# The sidecar binary and the integration tests both consume the lib.
path = "src/lib.rs"

# The backend with a pipe instead of a window: what the Electron shell spawns.
# Named explicitly because auto-discovery would call it `sidecar`, and a binary
# on someone's PATH should say whose it is.
[[bin]]
name = "tcode-sidecar"
path = "src/bin/sidecar.rs"

[dependencies]
tcode-core = { path = "../tcode-core" }
tcode-tools = { path = "../tcode-tools" }
tcode-providers = { path = "../tcode-providers" }
tcode-frontend = { path = "../tcode-frontend" }
# Real PTYs for the terminal pane (`src/terminal.rs`). A pipe is not a
# terminal: without a tty the shell drops its prompt, `vim` refuses to start
# and nothing sees a `SIGWINCH`. This is wezterm's abstraction over the three
# platform APIs, ConPTY included, which is the part that has no shortcut.
portable-pty = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
base64 = "0.22"

# The loopback origin for shown artifacts (`serve.rs`). `ServeDir` rather than
# hand-rolled file serving: byte ranges, conditional requests, HEAD, directory
# index and MIME-by-extension are all things a generated report exercises, and
# all things a second implementation gets subtly wrong.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
bytes = "1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `browser` tool's admission check (`src/browser.rs`). Scheme, host and port
# decide whether a model may point a tab somewhere, and those three are exactly
# the things a hand-written check gets subtly wrong.
url = "2"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
# `login_shell()` in `src/terminal.rs`: reading the user's shell from the
# passwd database needs `getpwuid_r`; guessing at the user from `$USER` would
# trust an env var for a fact the kernel knows.
libc = "0.2"
# Move a workspace file to the platform trash instead of removing it for good
# (`src/workspace.rs::Workspace::trash`). Freedesktop's spec on Linux, the
# Recycle Bin on Windows, Trash on macOS — the one cross-platform answer to
# "recoverable delete".
trash = "5"
ironcalc = "0.8"
calamine = "0.36.1"
csv = "1"

[dev-dependencies]
tempfile = "3"
futures = "0.3"
# An HTTP client for the serve tests, so they exercise the real thing a webview
# frame does rather than calling the handler directly.
reqwest = { version = "0.12", default-features = false }
