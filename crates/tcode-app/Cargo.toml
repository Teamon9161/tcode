[package]
name = "tcode-app"
version = "0.1.22"
edition = "2021"
description = "Desktop frontend for tcode: a Tauri shell over the shared agent harness"

# Deliberately NOT a workspace member, for the same reason as `tcode-voiced`:
# Tauri links the platform webview (webkit2gtk + libsoup on Linux), which is a
# system dependency `cargo build --workspace` must not start requiring of
# everyone working on the terminal frontend. Build it from this directory.

[lib]
name = "tcode_app"
# The Tauri binary and the integration tests both consume the lib; only
# `main.rs` ever starts a webview.
path = "src/lib.rs"

[[bin]]
name = "tcode-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tcode-core = { path = "../tcode-core" }
tcode-tools = { path = "../tcode-tools" }
tcode-providers = { path = "../tcode-providers" }
tcode-frontend = { path = "../tcode-frontend" }
# `unstable` is what exposes `Window::add_child` — multiple webviews in one
# window, which is the only way to put a real browser in a pane (see
# `src/browser.rs`). Tauri marks it unstable; that is the entry fee for this
# feature, as there is no stable alternative.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
# Real PTYs for the terminal pane (`src/terminal.rs`). A pipe is not a
# terminal: without a tty the shell drops its prompt, `vim` refuses to start
# and nothing sees a `SIGWINCH`. This is wezterm's abstraction over the three
# platform APIs, ConPTY included, which is the part that has no shortcut.
portable-pty = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
base64 = "0.22"
# WebKitGTK can announce a clipboard image without exposing a DOM File. Read
# that one user-initiated paste through the native clipboard as a fallback.
# The desktop app also runs natively under Wayland, so the default X11-only
# backend cannot see the clipboard that WebKitGTK just pasted from.
arboard = { version = "3", features = ["wayland-data-control"] }

# The loopback origin for shown artifacts (`serve.rs`). `ServeDir` rather than
# hand-rolled file serving: byte ranges, conditional requests, HEAD, directory
# index and MIME-by-extension are all things a generated report exercises, and
# all things a second implementation gets subtly wrong.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
bytes = "1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }

# The browser pane's geometry, on this platform only (`src/browser/gtk.rs`).
#
# Tauri builds a child webview here by packing it into the window's vertical
# `GtkBox`, which stacks it under the app and ignores every rect — there is no
# positioning to be had through the Tauri API at all on Linux. So the app takes
# the container over itself: one `GtkOverlay` holding a `GtkFixed`, which is the
# shape wry *does* honour. Version and features track tauri's own `gtk`
# dependency exactly, because these are the same widgets it hands us back.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

[dev-dependencies]
tempfile = "3"
futures = "0.3"
# An HTTP client for the serve tests, so they exercise the real thing a webview
# frame does rather than calling the handler directly.
reqwest = { version = "0.12", default-features = false }
