<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">tcode broken loop mark</title>
  <desc id="desc">A lime green vertically elongated loop with diagonal breaks on a dark rounded square.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1c20"/>
      <stop offset="1" stop-color="#17181b"/>
    </linearGradient>
    <linearGradient id="loop" x1="0.42" y1="0" x2="0.66" y2="1">
      <stop offset="0" stop-color="#c3ee3c"/>
      <stop offset="0.42" stop-color="#b7e83a"/>
      <stop offset="1" stop-color="#98dc2c"/>
    </linearGradient>
    <mask id="breaks">
      <rect width="1024" height="1024" fill="white"/>
      <polygon points="736,285 756,327 670,411 658,363" fill="black"/>
      <polygon points="267,696 355,611 368,659 289,738" fill="black"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="176" fill="url(#background)"/>
  <g mask="url(#breaks)">
    <rect x="250" y="163" width="522" height="695" rx="261" ry="255" fill="url(#loop)"/>
    <rect x="355" y="274" width="315" height="476" rx="157.5" ry="144" fill="url(#background)"/>
  </g>
</svg>
